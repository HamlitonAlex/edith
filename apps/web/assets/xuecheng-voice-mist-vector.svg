<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Xuecheng voice interaction mist vector redraw</title>
  <desc id="desc">Approximate vector redraw for the Xuecheng chat voice hold state, using dark grey green, warm clay orange, and soft mist expansion.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20362F"/>
      <stop offset="1" stop-color="#101D19"/>
    </linearGradient>
    <radialGradient id="pressGlow" cx="50%" cy="74%" r="52%">
      <stop offset="0" stop-color="#E08A5E" stop-opacity="0.72"/>
      <stop offset="0.33" stop-color="#C57152" stop-opacity="0.34"/>
      <stop offset="0.66" stop-color="#A7B7A7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#101D19" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24" x="-25%" y="-35%" width="150%" height="170%">
