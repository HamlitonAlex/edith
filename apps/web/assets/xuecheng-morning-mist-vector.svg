<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
  <title id="title">Xuecheng morning mist abstract vector redraw</title>
  <desc id="desc">Approximate vector redraw of the approved morning mist direction for the Xuecheng splash and home screens. This is not the original generated bitmap or an extracted source SVG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#273C35"/>
      <stop offset="0.46" stop-color="#172721"/>
      <stop offset="1" stop-color="#0F1A17"/>
    </linearGradient>
    <radialGradient id="dawn" cx="47%" cy="36%" r="58%">
      <stop offset="0" stop-color="#F5E3C7" stop-opacity="0.42"/>
      <stop offset="0.28" stop-color="#D88B62" stop-opacity="0.22"/>
      <stop offset="0.68" stop-color="#6B7E6E" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#172721" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clayCore" cx="50%" cy="48%" r="42%">
      <stop offset="0" stop-color="#D27A55" stop-opacity="0.68"/>
      <stop offset="0.45" stop-color="#AE624B" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#AE624B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="wideBlur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="round">
      <rect width="1440" height="1440" rx="0"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1440" height="1440" fill="url(#bg)"/>
    <rect width="1440" height="1440" fill="url(#dawn)"/>

    <g opacity="0.94" filter="url(#wideBlur)">
      <path d="M-170 1000C90 830 310 790 536 874c178 66 324 76 478-38 206-152 386-96 612 40v420H-170Z" fill="#E8EFE0" opacity="0.17"/>
      <path d="M-70 755c226-143 431-161 640-80 230 89 418 23 592-64 162-81 286-76 430 4v302c-225-72-395-65-572 39-192 113-382 128-585 40-172-74-320-60-505 36Z" fill="#BACAB5" opacity="0.22"/>
