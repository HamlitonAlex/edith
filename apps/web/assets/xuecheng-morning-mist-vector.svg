      <path d="M264 816c91-142 223-227 382-232 176-6 287 80 346 197 58 115 45 236-34 330-91 109-236 132-382 72-158-64-270-186-312-367Z" fill="url(#clayCore)" opacity="0.78"/>
      <path d="M560 452c115-43 230-18 320 66 100 93 119 210 52 322-67 113-201 174-338 133-130-40-204-141-190-268 12-112 65-206 156-253Z" fill="#F2DED0" opacity="0.20"/>
      <path d="M777 535c122 42 192 146 188 273-4 128-82 232-202 270-97 31-203 4-304-78 96 16 187-6 271-65 116-82 148-218 47-400Z" fill="#C47455" opacity="0.36"/>
    </g>

    <g fill="none" stroke-linecap="round" filter="url(#softBlur)">
