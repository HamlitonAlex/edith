      <path d="M141 837c216-114 398-121 548-37 144 81 286 78 491-40 108-62 209-79 322-46" stroke="#DDE7D6" stroke-width="72" opacity="0.15"/>
      <path d="M311 929c162-53 298-41 429 35 164 95 331 88 524-37" stroke="#F1C7AC" stroke-width="40" opacity="0.18"/>
      <path d="M404 628c112-118 247-165 405-141 144 22 250 89 317 203" stroke="#B9C4AD" stroke-width="30" opacity="0.13"/>
    </g>

    <g opacity="0.32">
      <path d="M432 1014c128 38 250 32 365-16 123-52 240-55 351-8" fill="none" stroke="#F6F1E5" stroke-width="6" stroke-linecap="round"/>
      <path d="M386 718c154-71 304-70 449 6 123 64 246 63 369-2" fill="none" stroke="#E4C2A8" stroke-width="5" stroke-linecap="round"/>
