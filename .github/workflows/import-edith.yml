name: Import prepared repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the prepared repository
        run: |
          unzip -o edith-project.zip
          rm -f edith-project.zip
          rm -f .github/workflows/import-edith.yml
      - name: Commit the imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import the Xuecheng companion prototype"
          git push
