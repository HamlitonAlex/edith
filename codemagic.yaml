workflows:
  xuechengnative-simulator:
    name: XuechengNative unsigned iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codex/native-codemagic-build
          include: true
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iOS Simulator app
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/codemagic"
          project="$CM_BUILD_DIR/XuechengNative/XuechengNative.xcodeproj"
          output="$CM_BUILD_DIR/build/codemagic"
          app="$output/XuechengNative/Build/Products/Debug-iphonesimulator/XuechengNative.app"
          echo "BUILD_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "MACOS_VERSION=$(sw_vers -productVersion)"
          xcodebuild -version
          echo "COMMIT_SHA=${CM_COMMIT:-unknown}"
          xcodebuild -list -project "$project" 2>&1 | tee "$output/schemes.log"
          xcodebuild -resolvePackageDependencies -project "$project" -scheme "XuechengNative" 2>&1 | tee "$output/package-resolve.log"
          build_started=$(date +%s)
          set +e
          xcodebuild build \
            -project "$project" \
            -scheme "XuechengNative" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$output/XuechengNative" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$output/xcodebuild.log"
          build_status=${PIPESTATUS[0]}
          set -e
          echo "BUILD_DURATION_SECONDS=$(($(date +%s) - build_started))"
          echo "XCODEBUILD_EXIT_CODE=$build_status"
          echo "XCODE_WARNING_LINES=$(grep -Ec 'warning:' "$output/xcodebuild.log" || true)"
          if [[ "$build_status" -eq 0 ]]; then
            test -d "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$output/XuechengNative-simulator.app.zip"
            echo "APP_ARTIFACT=$app"
          fi
          exit "$build_status"
      - name: Run native domain XCTest
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 -u "$CM_BUILD_DIR/XuechengNative/ci/run_domain_tests.py"
        ignore_failure: true
      - name: Parse native XCTest report
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          results="$CM_BUILD_DIR/build/test-results/XuechengNativeTests.xcresult"
          output="$CM_BUILD_DIR/build/test-results"
          if [[ ! -d "$results" ]]; then
            echo "ERROR: XCTest result bundle is missing: $results"
            exit 1
          fi
          if [[ ! -f "$output/xctest-exit-code.txt" ]]; then
            echo "ERROR: XCTest exit code report is missing"
            exit 1
          fi
          xcrun xcresulttool get --path "$results" --format json > "$output/XuechengNativeTests.json"
          xcrun xcresulttool get test-results summary --path "$results" --format json > "$output/XuechengNativeTests-summary.json"
          xcrun xcresulttool get test-results tests --path "$results" --format json > "$output/XuechengNativeTests-tests.json"
          python3 - "$output" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          summary = json.loads((output / "XuechengNativeTests-summary.json").read_text())
          xctest_exit_code = int((output / "xctest-exit-code.txt").read_text().strip())
          tests_path = output / "XuechengNativeTests-tests.json"
          tests_json = tests_path.read_text()
          tests_tree = json.loads(tests_json)

          def first_count(*keys):
              for key in keys:
                  value = summary.get(key)
                  if isinstance(value, int):
                      return value
              return None

          test_count = first_count("totalTestCount", "testCount", "testsCount")
          passed = first_count("passedTests", "passedCount", "passedTestCount")
          failed = first_count("failedTests", "failedCount", "failedTestCount")
          skipped = first_count("skippedTests", "skippedCount", "skippedTestCount")
          if None in (test_count, passed, failed, skipped):
              raise SystemExit(f"ERROR: unrecognized xcresult summary schema: {summary}")

          suites = set()
          def collect_suites(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if isinstance(child, str) and key.lower() in {
                          "name", "nodename", "testname", "suite", "suitename", "testidentifier"
                      } and (child.endswith("Tests") or "Test Suite" in child):
                          suites.add(child)
                      collect_suites(child)
              elif isinstance(value, list):
                  for child in value:
                      collect_suites(child)
          collect_suites(tests_tree)
          has_learning_domain_tests = "LearningDomainTests" in tests_json

          print(f"testCount={test_count}")
          print(f"passedCount={passed}")
          print(f"failedCount={failed}")
          print(f"skippedCount={skipped}")
          print("Test Suites=" + (", ".join(sorted(suites)) if suites else "(none identified)"))
          print(f"contains LearningDomainTests={has_learning_domain_tests}")
          print(f"xcodebuild test exit code={xctest_exit_code}")

          if test_count <= 0:
              raise SystemExit("ERROR: xcresult contains no executed tests")
          if not has_learning_domain_tests:
              raise SystemExit("ERROR: LearningDomainTests was not found in xcresult")
          if failed > 0:
              raise SystemExit("ERROR: XCTest reported failures")
          if xctest_exit_code != 0:
              raise SystemExit("ERROR: xcodebuild test exited unsuccessfully")
          PY
      - name: Simulator smoke launch and screenshot
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          output="$CM_BUILD_DIR/build/codemagic"
          mkdir -p "$output/smoke"
          python3 -u "$CM_BUILD_DIR/XuechengNative/ci/simulator_smoke.py" \
            --app "$output/XuechengNative/Build/Products/Debug-iphonesimulator/XuechengNative.app" \
            --output "$output/smoke" 2>&1 | tee "$output/smoke/simctl.log"
    artifacts:
      - build/codemagic/XuechengNative/Build/Products/Debug-iphonesimulator/XuechengNative.app
      - build/codemagic/XuechengNative-simulator.app.zip
      - build/codemagic/xcodebuild.log
      - build/codemagic/schemes.log
      - build/codemagic/package-resolve.log
      - build/codemagic/smoke/**
      - build/codemagic/tests/**
      - build/test-results/XuechengNativeTests.xcresult
      - build/test-results/**/*.xcresult
      - build/test-results/**/*.xml
      - build/test-results/**/*.json
      - build/test-results/**/*.log
      - build/test-results/xctest-exit-code.txt
      - /tmp/xcodebuild_logs/*.log
  xuechengnative-device-archive:
    name: XuechengNative signed development IPA (manual run)
    max_build_duration: 90
    instance_type: mac_mini_m2
    triggering:
      events: []
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: app.xuecheng.nativeui
    scripts:
      - name: Confirm signing inputs
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "This workflow requires an Apple Development certificate and an iPhone-eligible Development provisioning profile in Codemagic Code signing identities."
          test -d "$CM_BUILD_DIR/XuechengNative/XuechengNative.xcodeproj"
          xcodebuild -version
          xcodebuild -list -project "$CM_BUILD_DIR/XuechengNative/XuechengNative.xcodeproj"
      - name: Apply Codemagic signing profiles
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project use-profiles --project "$CM_BUILD_DIR/XuechengNative/XuechengNative.xcodeproj"
          test -s "$HOME/export_options.plist"
      - name: Archive and export signed IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          output="$CM_BUILD_DIR/build/codemagic/device"
          mkdir -p "$output/ipa"
          xcodebuild archive \
            -project "$CM_BUILD_DIR/XuechengNative/XuechengNative.xcodeproj" \
            -scheme XuechengNative -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$output/XuechengNative.xcarchive" \
            2>&1 | tee "$output/archive.log"
          xcodebuild -exportArchive \
            -archivePath "$output/XuechengNative.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$output/ipa" \
            2>&1 | tee "$output/export.log"
          test -n "$(find "$output/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
    artifacts:
      - build/codemagic/device/ipa/*.ipa
      - build/codemagic/device/archive.log
      - build/codemagic/device/export.log
      - /tmp/xcodebuild_logs/*.log
