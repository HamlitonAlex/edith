<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">学程四个产品界面</title><desc id="desc">对话为主界面，今日、路径和我的为三个辅助界面。</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e7"/><stop offset="1" stop-color="#f5e6dc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#59372d" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="500" rx="40" fill="url(#bg2)"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#2d241f">一个伙伴，四个彼此连通的界面</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#s)">
    <rect x="55" y="110" width="310" height="310" rx="42" fill="#fffaf4" stroke="#f07a45" stroke-width="4"/><circle cx="210" cy="185" r="44" fill="#f07a45"/><path d="M190 185h40M190 172h28M190 198h23" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="210" y="265" text-anchor="middle" font-size="28" font-weight="700" fill="#302722">对话</text><text x="210" y="305" text-anchor="middle" font-size="18" fill="#79675d">说一句，她顺势理解</text><text x="210" y="336" text-anchor="middle" font-size="18" fill="#79675d">主动联系，但不打扰</text><rect x="120" y="362" width="180" height="36" rx="18" fill="#ffe4cb"/><text x="210" y="386" text-anchor="middle" font-size="16" fill="#a44d31">产品的主入口</text>
    <rect x="400" y="142" width="225" height="250" rx="32" fill="#fffaf4"/><circle cx="512" cy="200" r="32" fill="#f3b83f"/><text x="512" y="209" text-anchor="middle" font-size="25">✓</text><text x="512" y="269" text-anchor="middle" font-size="25" font-weight="700" fill="#302722">今天</text><text x="512" y="309" text-anchor="middle" font-size="17" fill="#79675d">少量具体行动</text><text x="512" y="338" text-anchor="middle" font-size="17" fill="#79675d">直接进入现实</text>
    <rect x="662" y="142" width="225" height="250" rx="32" fill="#fffaf4"/><circle cx="774" cy="200" r="32" fill="#75be91"/><path d="M758 207l13-14 12 8 12-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="774" y="269" text-anchor="middle" font-size="25" font-weight="700" fill="#302722">路径</text><text x="774" y="309" text-anchor="middle" font-size="17" fill="#79675d">方向、依据与变化</text><text x="774" y="338" text-anchor="middle" font-size="17" fill="#79675d">不是固定路线图</text>
    <rect x="924" y="142" width="225" height="250" rx="32" fill="#fffaf4"/><circle cx="1036" cy="200" r="32" fill="#b68aef"/><circle cx="1036" cy="192" r="10" fill="#fff"/><path d="M1019 218c4-14 30-14 34 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="1036" y="269" text-anchor="middle" font-size="25" font-weight="700" fill="#302722">我的</text><text x="1036" y="309" text-anchor="middle" font-size="17" fill="#79675d">形象、边界与授权</text><text x="1036" y="338" text-anchor="middle" font-size="17" fill="#79675d">由用户随时调整</text>
  </g>
</svg>
